name: Build and Publish Docker Images

on:
  push:
    branches:
      - "2.0"
      - "main"
      - "master"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo_meta
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Judge Image
        id: meta_judge
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_meta.outputs.owner }}/oj-judge-cangjie
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/2.0' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Judge Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cangjie/Dockerfile.judge
          push: true
          tags: ${{ steps.meta_judge.outputs.tags }}
          labels: ${{ steps.meta_judge.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Backend Image
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_meta.outputs.owner }}/oj-backend-cangjie
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/2.0' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: cangjie/Dockerfile.backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
